repos:
  - repo: local
    hooks:
      - id: docs-reference-guard
        name: Docs Reference Guard
        entry: python -m pytest -q tests/test_docs_references.py
        language: system
        pass_filenames: false
      - id: text-integrity-guard
        name: Text Integrity Guard
        entry: python -m pytest -q tests/test_text_integrity.py
        language: system
        pass_filenames: false
      - id: pyright
        name: Pyright
        entry: python -m pyright
        language: system
        pass_filenames: false
